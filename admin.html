<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS — KII Application Management System</title>
<link rel="icon" type="image/png" href="asset/kii_logocl.png">
<link rel="stylesheet" href="css/style.css?v=srv-37">
<link rel="stylesheet" href="css/admin.css?v=srv-37">
</head>
<body data-spa>
<div class="ams-shell">

  <aside class="ams-side">
    <div class="ams-logo">
      <img src="asset/kii_logobw.png" alt="KII" class="mark-img">
    </div>
    <nav class="ams-nav" id="amsNav"></nav>
    <div class="side-hero">
      <img class="hero-img" src="asset/sidebar.jpeg" alt="KII" draggable="false">
      <div class="hero-veil"></div>
      <div class="hero-txt">Innovation<br>today for a<br><span>brighter tomorrow</span></div>
    </div>
  </aside>

  <div class="ams-main">
    <div class="ams-top">
      <div class="tt">
        <img src="asset/kii_logocl.png" alt="KII" class="tt-logo">
        <div class="tt-txt">
          <h2>Application Management System</h2>
          <small>Innovative People. A Stronger Kurdistan.</small>
        </div>
      </div>
      <div class="search"><input type="text" id="globalSearch" placeholder="Search applicants, meetings, documents…"></div>
      <div class="notif-wrap">
        <button class="bell" id="bellBtn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>
          </svg><i id="bellCount">0</i>
        </button>
        <div class="notif-drop hidden" id="notifDrop"></div>
      </div>
      <div class="ams-user" id="userMenu">
        <div class="avatar" id="userAvatar"></div>
        <div class="who"><span id="userName"></span><small id="userRole"></small></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        <div class="menu hidden" id="userMenuDrop">
          <a href="?v=settings">Profile settings</a>
          <a href="#" id="logoutBtn">Sign out</a>
        </div>
      </div>
    </div>
    <div class="ams-content" id="amsContent"></div>
    <footer class="ams-foot">
      <span>© 2025 Kurdistan Innovation Institute (KII). All rights reserved.</span>
      <span>Building Innovation. Empowering People. Strengthening Kurdistan.</span>
    </footer>
  </div>

</div>

<script src="js/server-sync.js?v=srv-37"></script>
<script src="js/common.js?v=srv-37"></script>
<script src="js/form-schema.js?v=srv-37"></script>
<script src="js/ams.js?v=srv-37"></script>
<script src="js/admin.js?v=srv-37"></script>
</body>
</html>
