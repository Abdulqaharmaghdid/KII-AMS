app = "kii-ams"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  KII_DATA_DIR = "/app/data"

[mounts]
  source = "kii_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
