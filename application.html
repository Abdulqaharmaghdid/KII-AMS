<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application — KII Innovation Program</title>
<link rel="icon" type="image/png" href="asset/kii_logocl.png">
<link rel="stylesheet" href="css/style.css?v=srv-35">
</head>
<body data-spa>
<div class="app-shell">

  <aside class="sidebar">
    <div class="side-brand">
      <img src="asset/kii_logobw.png" alt="KII" class="side-brand-logo">
      <div>KII Application<small id="sideApplicant"></small></div>
    </div>
    <ul id="sideNav">
      <li><a href="dashboard.html"><span class="dot"></span>Home</a></li>
      <!-- Section links are generated by the application form. -->
    </ul>
    <div class="side-foot" id="sideProgress"></div>
  </aside>

  <main class="app-main">
    <div class="panel">
      <div class="app-head">
        <div class="step-label" id="stepLabel"></div>
        <h1 id="sectionTitle"></h1>
        <p class="sub" id="sectionSub"></p>
      </div>
      <div id="alert" class="alert alert-error hidden"></div>
      <div id="sectionBody"></div>
      <div class="form-actions" id="formActions">
        <button class="btn btn-secondary" id="backBtn">Back</button>
        <div class="right">
          <button class="btn btn-secondary" id="saveBtn">Save &amp; Exit</button>
          <button class="btn" id="continueBtn">Continue</button>
        </div>
      </div>
    </div>
  </main>

</div>

<datalist id="countryList"></datalist>

<script src="js/server-sync.js?v=srv-35"></script>
<script src="js/common.js?v=srv-35"></script>
<script src="js/application-locations.js?v=srv-35"></script>
<script src="js/application-merged.js?v=srv-35"></script>
</body>
</html>
